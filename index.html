<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ফলাফল অনুসন্ধান</title><style>body{font-family:system-ui,sans-serif;background:#eff6ff;min-height:100vh;display:grid;place-items:center;margin:0}.card{background:white;padding:28px;border-radius:20px;max-width:440px;width:85%;box-shadow:0 12px 40px #1232}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border-radius:10px}input{border:1px solid #ccd}button{border:0;background:#2563eb;color:white;font-weight:bold}#result{margin-top:20px}</style><main class="card"><h1>পরীক্ষার ফলাফল</h1><p>রোল নম্বর লিখে ফলাফল খুঁজুন।</p><form id="f"><input id="roll" placeholder="রোল নম্বর, যেমন 1213" required><button>ফলাফল খুঁজুন</button></form><div id="result"></div></main><script>const f=document.querySelector('#f'),out=document.querySelector('#result');f.addEventListener('submit',async e=>{e.preventDefault();out.textContent='খোঁজা হচ্ছে…';try{const r=await fetch('./results.csv');if(!r.ok)throw Error();const lines=(await r.text()).trim().split(/\r?\n/),headers=lines.shift().split(','),row=lines.map(x=>x.split(',')).find(x=>x[0].trim()===document.querySelector('#roll').value.trim());if(!row){out.textContent='এই রোল নম্বরের ফলাফল পাওয়া যায়নি।';return}out.innerHTML='';headers.forEach((h,i)=>{const p=document.createElement('p');p.textContent=h+': '+(row[i]||'');out.appendChild(p)})}catch{out.textContent='results.csv ফাইলটি একই ফোল্ডারে রাখুন এবং ওয়েব সার্ভারে চালান।'}});</script></html>
