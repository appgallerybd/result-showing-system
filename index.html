<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b35">
<title>Students Result Portal | রঘুনাথপুর হাসানিয়া মাদরাসা</title>
<link rel="stylesheet" href="https://fonts.maateen.me/solaiman-lipi/font.css">
<style>
:root{--navy:#071b35;--blue:#356dff;--mint:#6ee7c3;--ink:#12233f;--muted:#6d7d96;--line:#e6edf6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'SolaimanLipi',sans-serif;color:var(--ink);background:#f3f7fc;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 8% 10%,#dbeafe 0,transparent 35%),radial-gradient(ellipse at 95% 85%,#d1fae5 0,transparent 32%);z-index:-1}
.topbar{min-height:82px;padding:10px max(22px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;color:var(--navy)}
.brand-icon{width:43px;height:43px;flex:0 0 43px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#437cff,#2348bb);box-shadow:0 8px 20px #356dff40}
.school-small{display:block;font-size:14px;font-weight:500;color:#52647f;margin-top:1px}
.top-pill{font-size:13px;font-weight:600;color:#176b55;background:#dffaf0;padding:8px 13px;border:1px solid #c5f2e3;border-radius:999px;white-space:nowrap}
main{width:min(100% - 32px,980px);margin:24px auto 52px}
.hero{position:relative;overflow:hidden;border-radius:30px;background:linear-gradient(125deg,#071b35 0%,#102e55 60%,#19436a 100%);padding:38px 40px;color:white;box-shadow:0 22px 60px #102b5025}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff15;border-radius:50%;pointer-events:none}
.hero:before{width:330px;height:330px;right:-80px;top:-175px;box-shadow:0 0 0 28px #ffffff05,0 0 0 58px #ffffff04}
.hero:after{width:210px;height:210px;right:130px;bottom:-170px;box-shadow:0 0 0 24px #ffffff05}
.hero-content{position:relative;z-index:1;max-width:650px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#a9f4df;background:#ffffff0d;border:1px solid #ffffff20;border-radius:999px;padding:7px 12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}
h1{font-size:clamp(29px,5vw,44px);line-height:1.25;margin:18px 0 10px;letter-spacing:0}
.hero p{font-size:16px;color:#c3d2e6;line-height:1.8;margin:0;max-width:540px}
.search-card{position:relative;z-index:2;margin:-25px 24px 0;background:#fff;border:1px solid #e8eef7;border-radius:22px;padding:25px;box-shadow:0 18px 48px #152c4d14}
.search-title{display:flex;align-items:center;gap:10px;margin-bottom:15px;font-size:19px;font-weight:700}
.search-title svg{color:var(--blue)}
label{display:block;font-size:15px;font-weight:600;color:#53647e;margin-bottom:8px}
.search-row{display:flex;gap:12px}
.input-wrap{position:relative;flex:1}
.input-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#8b9bb2}
input{width:100%;height:56px;border:1px solid #dce5f1;border-radius:13px;background:#f9fbfe;padding:0 16px 0 47px;font:500 16px 'SolaimanLipi',sans-serif;color:var(--ink);outline:none;transition:border .2s,box-shadow .2s,background .2s}
input:focus{border-color:#6c92ff;background:#fff;box-shadow:0 0 0 4px #356dff16}
button{font:600 16px 'SolaimanLipi',sans-serif;cursor:pointer;border:0;transition:transform .2s,box-shadow .2s,opacity .2s}
.search-btn{min-width:178px;height:56px;border-radius:13px;color:white;background:linear-gradient(135deg,#427bff,#2856d8);box-shadow:0 9px 20px #356dff35;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px}
.search-btn:hover{transform:translateY(-2px);box-shadow:0 13px 24px #356dff45}
button:disabled{opacity:.65;cursor:wait;transform:none}
.helper{font-size:13px;color:#8290a5;margin:10px 0 0}
#result{margin:22px 24px 0}
.status{padding:17px 18px;border-radius:14px;background:#fff;border:1px solid var(--line);color:#53647e;box-shadow:0 8px 22px #102b5008}
.status.error{background:#fff7f7;border-color:#ffdada;color:#a33131}
.result-card{background:#fff;border:1px solid #dce6f2;border-radius:22px;overflow:hidden;box-shadow:0 18px 45px #102b5010;animation:rise .45s ease both}
.result-head{padding:22px 25px;background:linear-gradient(120deg,#f8fbff,#eef5ff);border-bottom:1px solid #e5edf8;display:flex;justify-content:space-between;gap:15px;align-items:center}
.student-label{font-size:13px;font-weight:700;color:#71829b}
.student-name{font-size:26px;font-weight:700;margin:3px 0 0;color:var(--navy)}
.pass-badge{display:inline-flex;align-items:center;gap:6px;background:#dcfce9;color:#13734b;border:1px solid #b9f2d0;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px 24px}
.stat{padding:15px;border-radius:15px;background:#f8faff;border:1px solid #eaf0f8}
.stat span{display:block;font-size:14px;color:#75849b;margin-bottom:4px}
.stat strong{font-size:25px;line-height:1.3;color:var(--navy)}
.details{padding:0 24px 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.detail{padding:12px 14px;border:1px solid #edf1f7;border-radius:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.detail span{font-size:15px;color:#728198}.detail strong{font-size:15px;text-align:right;overflow-wrap:anywhere;color:#243955}
.subject-title{padding:0 24px 12px;font-size:18px;font-weight:700;color:#344966}
.subjects{padding:0 24px 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.subject{border:1px solid #e7edf6;border-radius:12px;padding:13px;background:#fff}
.subject span{display:block;font-size:14px;color:#7b8ba2}.subject strong{display:block;font-size:21px;margin-top:3px;color:#1a3558}
.result-actions{border-top:1px solid #edf1f7;padding:17px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.result-actions p{font-size:13px;color:#8a98ab;margin:0}
.pdf-btn{border:0;background:linear-gradient(135deg,#087e69,#06634f);color:white;border-radius:11px;padding:12px 17px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 8px 18px #087e6925}
.pdf-btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px #087e6935}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){.topbar{min-height:72px;padding:10px 14px}.brand{font-size:16px;gap:9px}.brand-icon{width:38px;height:38px;flex-basis:38px}.school-small{font-size:12px}.top-pill{font-size:11px;padding:7px 9px}main{width:min(100% - 22px,980px);margin:15px auto 30px}.hero{padding:29px 23px 45px;border-radius:23px}.hero p{font-size:15px}.search-card{margin:-25px 10px 0;padding:19px 16px;border-radius:18px}.search-row{flex-direction:column}.search-btn{width:100%;min-width:0}.input-wrap input{height:53px}#result{margin:18px 10px 0}.result-head{padding:19px 17px}.student-name{font-size:22px}.stats{padding:15px;gap:8px}.stat{padding:12px 10px}.stat strong{font-size:21px}.stat span{font-size:12px}.details{padding:0 15px 18px;grid-template-columns:1fr;gap:8px}.subject-title{padding:0 15px 10px}.subjects{padding:0 15px 18px;grid-template-columns:repeat(2,minmax(0,1fr))}.result-actions{padding:15px;align-items:stretch;flex-direction:column}.pdf-btn{width:100%}}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff!important;color:#16243a!important;font-family:'SolaimanLipi',sans-serif!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .topbar,.hero,.search-card,body:before{display:none!important}
 main{width:100%;max-width:none;margin:0;padding:0}
 #result{margin:0!important}
 .result-card{display:none!important}
 .print-sheet{display:block!important;position:relative;min-height:265mm;border:3px double #b58a3c;padding:7mm;background:#fff;overflow:hidden}
 .print-inner{border:1px solid #d9c28f;min-height:248mm;padding:8mm;position:relative}
 .print-inner:before{content:"";position:absolute;inset:4mm;border:1px solid #eee4cd;pointer-events:none}
 .print-top{text-align:center;border-bottom:2px solid #183c6b;padding:2mm 0 5mm;position:relative}
 .print-emblem{width:19mm;height:19mm;margin:0 auto 3mm;border:2px solid #b58a3c;border-radius:50%;display:grid;place-items:center;color:#183c6b;font-size:23px;font-weight:bold}
 .print-school{font-size:25px;font-weight:bold;color:#102b50;line-height:1.4}
 .print-address{font-size:14px;color:#4b5f79;margin-top:1mm}
 .print-title{display:inline-block;margin-top:4mm;padding:2mm 12mm;border-radius:2px;background:#102b50!important;color:white!important;font-size:18px;font-weight:bold;letter-spacing:.4px}
 .print-meta{display:flex;justify-content:space-between;gap:6mm;margin:5mm 0 3mm;font-size:14px}
 .print-student{display:grid;grid-template-columns:1fr 1fr;gap:2mm 8mm;padding:4mm;background:#f7f9fc!important;border:1px solid #d9e0e9}
 .print-field{display:flex;gap:2mm;font-size:14px;line-height:1.7}
 .print-field b{color:#3e5069;font-weight:normal;white-space:nowrap}
 .print-field span{font-weight:bold;color:#172d4a;overflow-wrap:anywhere}
 .print-table-title{text-align:center;font-size:16px;font-weight:bold;color:#102b50;margin:5mm 0 2mm}
 .print-table{width:100%;border-collapse:collapse;font-size:14px}
 .print-table th{background:#102b50!important;color:#fff!important;font-weight:bold}
 .print-table th,.print-table td{border:1px solid #bfcbd9;padding:2.5mm 3mm;text-align:left}
 .print-table td:last-child,.print-table th:last-child{text-align:center;width:28mm}
 .print-table tbody tr:nth-child(even){background:#f5f8fc!important}
 .print-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;margin-top:4mm}
 .print-summary div{border:1px solid #cbd5e1;background:#f7f9fc!important;padding:3mm;text-align:center}
 .print-summary span{display:block;font-size:12px;color:#607087}
 .print-summary strong{display:block;font-size:20px;color:#102b50;margin-top:1mm}
 .print-result{text-align:center;margin-top:4mm;font-size:15px;font-weight:bold;color:#126647}
 .print-note{font-size:11px;color:#6c7787;border-top:1px solid #d8dfE8;margin-top:5mm;padding-top:2mm;text-align:center}
 .print-signatures{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12mm;margin-top:16mm;text-align:center;font-size:12px;color:#3d4d62}
 .print-signatures div{border-top:1px solid #6d7b8c;padding-top:2mm}
 .stat,.detail,.subject,.print-student,.print-table tr{break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><span class="brand-icon"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 6v15.5A2.5 2.5 0 0 1 6.5 19H20M8 7h8M8 11h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span>Students Result Portal<span class="school-small">রঘুনাথপুর হাসানিয়া মাদরাসা</span></span></div>
 <span class="top-pill">● ফলাফল পোর্টাল</span>
</header>
<main>
 <section class="hero">
  <div class="hero-content">
   <span class="eyebrow"><span class="dot"></span> STUDENT RESULT PORTAL</span>
   <h1>রঘুনাথপুর হাসানিয়া মাদরাসা</h1>
   <p>শিঙ্গাশোলপুর, কালিয়া, নড়াইল</p>
  </div>
 </section>
 <section class="search-card">
  <div class="search-title"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> ফলাফল অনুসন্ধান</div>
  <form id="searchForm">
   <label for="roll">শিক্ষার্থীর রোল নম্বর</label>
   <div class="search-row">
    <div class="input-wrap"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M8 8h8M8 12h2m4 0h2m-8 4h2m4 0h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="roll" inputmode="numeric" autocomplete="off" placeholder="রোল নম্বর লিখুন (যেমন 1213)" required></div>
    <button class="search-btn" id="searchButton" type="submit"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> ফলাফল খুঁজুন</button>
   </div>
   <p class="helper">অনুগ্রহ করে আপনার সঠিক রোল নম্বরটি লিখুন।</p>
  </form>
 </section>
 <section id="result" aria-live="polite"></section>
</main>
<script>
const form=document.getElementById('searchForm');
const rollInput=document.getElementById('roll');
const output=document.getElementById('result');
const button=document.getElementById('searchButton');
let recordsPromise;
function parseCSV(text){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i],next=text[i+1];
  if(c==='"'&&quoted&&next==='"'){cell+='"';i++}
  else if(c==='"'){quoted=!quoted}
  else if(c===','&&!quoted){row.push(cell);cell=''}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);row=[];cell=''}
  else cell+=c;
 }
 if(cell!==''||row.length){row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row)}
 if(!rows.length)return [];
 const headers=rows.shift().map(v=>v.trim().replace(/^\uFEFF/,''));return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,(values[i]||'').trim()])));
}
async function loadRecords(){if(!recordsPromise)recordsPromise=fetch('./results.csv',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('CSV_LOAD');return r.text()}).then(parseCSV);return recordsPromise}
const labels={roll:'রোল নম্বর',name:'শিক্ষার্থীর নাম',father_name:'পিতার নাম',mother_name:'মাতার নাম',class:'শ্রেণি',section:'শাখা',exam:'পরীক্ষা',bangla:'বাংলা',english:'ইংরেজি',arabic:'আরবি',mathematics:'গণিত',general_knowledge:'সাধারণ জ্ঞান',fiqh:'ফিকহ',total_marks:'মোট নম্বর',full_marks:'পূর্ণমান',percentage:'শতকরা নম্বর',gpa:'জিপিএ',result:'ফলাফল'};
const subjects=['bangla','english','arabic','mathematics','general_knowledge','fiqh'];
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function addDetail(parent,label,value){const d=el('div','detail');d.append(el('span','',label),el('strong','',value||'—'));parent.appendChild(d)}
function renderResult(found){
 output.replaceChildren();const card=el('article','result-card');
 const head=el('div','result-head'),person=el('div');person.append(el('div','student-label','শিক্ষার্থীর ফলাফল'),el('h2','student-name',found.name||'শিক্ষার্থী'));head.appendChild(person);
 const badge=el('span','pass-badge',(found.result||'').includes('উত্তীর্ণ')?'✓ '+found.result:(found.result||'ফলাফল প্রকাশিত'));head.appendChild(badge);card.appendChild(head);
 const stats=el('div','stats');
 [[found.total_marks||'—','মোট নম্বর'],[found.gpa||'—','জিপিএ'],[(found.percentage?found.percentage+'%':'—'),'প্রাপ্তির হার']].forEach(([v,l])=>{const s=el('div','stat');s.append(el('span','',l),el('strong','',v));stats.appendChild(s)});card.appendChild(stats);
 const details=el('div','details');
 [['রোল নম্বর',found.roll],['পিতার নাম',found.father_name],['মাতার নাম',found.mother_name],['শ্রেণি',found.class],['শাখা',found.section],['পরীক্ষা',found.exam],['পূর্ণমান',found.full_marks]].forEach(([l,v])=>{if(v)addDetail(details,l,v)});card.appendChild(details);
 card.append(el('div','subject-title','বিষয়ভিত্তিক নম্বর'));
 const subjectGrid=el('div','subjects');subjects.forEach(key=>{if(found[key]!==undefined){const s=el('div','subject');s.append(el('span','',labels[key]||key),el('strong','',found[key]));subjectGrid.appendChild(s)}});card.appendChild(subjectGrid);
 const actions=el('div','result-actions');actions.appendChild(el('p','','মার্কশিটটি PDF হিসেবে সংরক্ষণ করতে নিচের বাটনে চাপুন।'));
 const pdf=el('button','pdf-btn','↓  মার্কশিট PDF ডাউনলোড করুন');pdf.type='button';pdf.addEventListener('click',()=>window.print());actions.appendChild(pdf);card.appendChild(actions);output.appendChild(card);
 const sheet=el('section','print-sheet');
 const inner=el('div','print-inner');
 const printTop=el('header','print-top');
 printTop.append(el('div','print-emblem','ر'),el('div','print-school','রঘুনাথপুর হাসানিয়া মাদরাসা'),el('div','print-address','শিঙ্গাশোলপুর, কালিয়া, নড়াইল'),el('div','print-title','একাডেমিক মার্কশিট'));
 inner.appendChild(printTop);
 const meta=el('div','print-meta');meta.append(el('span','', 'পরীক্ষা: '+(found.exam||'—')),el('span','', 'শিক্ষাবর্ষ: '+(found.year||'—')));inner.appendChild(meta);
 const student=el('div','print-student');
 [['শিক্ষার্থীর নাম',found.name],['রোল নম্বর',found.roll],['পিতার নাম',found.father_name],['মাতার নাম',found.mother_name],['শ্রেণি',found.class],['শাখা',found.section]].forEach(([label,value])=>{if(value){const f=el('div','print-field');f.append(el('b','',label+':'),el('span','',value));student.appendChild(f)}});
 inner.appendChild(student);
 inner.appendChild(el('div','print-table-title','বিষয়ভিত্তিক নম্বর বিবরণ'));
 const table=el('table','print-table');const thead=el('thead'),trh=el('tr');trh.append(el('th','','ক্রম'),el('th','','বিষয়ের নাম'),el('th','','প্রাপ্ত নম্বর'));thead.appendChild(trh);table.appendChild(thead);
 const tbody=el('tbody');subjects.forEach((key,index)=>{if(found[key]!==undefined){const tr=el('tr');tr.append(el('td','',String(index+1)),el('td','',labels[key]||key),el('td','',found[key]));tbody.appendChild(tr)}});table.appendChild(tbody);inner.appendChild(table);
 const summary=el('div','print-summary');[[found.total_marks||'—','মোট নম্বর'],[found.full_marks||'—','পূর্ণমান'],[found.gpa||'—','GPA']].forEach(([value,label])=>{const item=el('div');item.append(el('span','',label),el('strong','',value));summary.appendChild(item)});inner.appendChild(summary);
 inner.appendChild(el('div','print-result','ফলাফল: '+(found.result||'—')+'  |  প্রাপ্তির হার: '+(found.percentage?found.percentage+'%':'—')));
 inner.appendChild(el('div','print-note','এই মার্কশিটটি Students Result Portal থেকে তৈরি করা হয়েছে।'));
